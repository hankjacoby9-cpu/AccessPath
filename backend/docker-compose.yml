# Runs the whole backend locally: docker compose up
services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    env_file: .env
    environment: &env
      DATABASE_URL: postgres://accesspath:accesspath@db:5432/accesspath
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    volumes: [".:/app"]
    depends_on: [db, redis, minio]

  worker:
    build: .
    command: celery -A config worker -Q convert,llm,export -l info
    env_file: .env
    environment: *env
    volumes: [".:/app"]
    depends_on: [db, redis, minio]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: accesspath
      POSTGRES_PASSWORD: accesspath
      POSTGRES_DB: accesspath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
